# Builds the Godot web export and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot + web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot/templates && cd ~/godot
          curl -sSLf -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          # The full template pack is ~1.2 GB; keep only what the web export needs.
          curl -sSLf -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz 'templates/web_*' 'templates/version.txt' -d templates && rm templates.tpz

      - name: Install web templates
        run: |
          dest="$HOME/.local/share/godot/export_templates/$(tr -d '\r\n' < ~/godot/templates/version.txt)"
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"

      - name: Import project
        run: timeout 300 ~/godot/godot --headless --path . --import || true

      - name: Rules tests
        run: ~/godot/godot --headless --path . --script res://tests/rules_test.gd -- --quick

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
